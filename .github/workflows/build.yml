name: Build Windows exe

on:
  push:
    tags: ["v*"]          # ex : git tag v1.0 && git push --tags
  workflow_dispatch:      # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Télécharger libmpv (avec chargeur Vulkan)
        shell: pwsh
        run: |
          $url = "https://github.com/SubtitleEdit/support-files/releases/download/libmpv-2026-08-14b/libmpv2-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile libmpv.zip
          Expand-Archive libmpv.zip -DestinationPath libmpv
          $dll = Get-ChildItem libmpv -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll introuvable dans l'archive" }
          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256 libmpv-2.dll : $hash"
          if ($hash -ne "f709c7ca8b183bec76b8158bf0c45c53018c63366750729352612f228ff7bdea") { throw "Empreinte SHA256 inattendue" }
          Copy-Item $dll.FullName .
          $vk = Get-ChildItem libmpv -Recurse -Filter vulkan-1.dll | Select-Object -First 1
          if ($vk) { Copy-Item $vk.FullName . }
          Get-ChildItem *.dll

      - name: Compiler avec PyInstaller
        shell: pwsh
        run: |
          $pyArgs = @('--noconfirm','--clean','--onedir','--windowed','--name','LecteurSurround','--add-binary','libmpv-2.dll;.')
          if (Test-Path vulkan-1.dll) { $pyArgs += @('--add-binary','vulkan-1.dll;.') }
          $pyArgs += 'lecteur_surround.py'
          python -m PyInstaller @pyArgs

      - name: Créer l'archive zip
        shell: pwsh
        run: Compress-Archive -Path dist\LecteurSurround -DestinationPath LecteurSurround-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LecteurSurround-windows
          path: LecteurSurround-windows.zip

      - name: Publier une Release (si tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LecteurSurround-windows.zip
